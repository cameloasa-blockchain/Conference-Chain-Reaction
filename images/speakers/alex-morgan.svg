<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-labelledby="title desc">
    <title id="title">Alex Morgan</title>
    <desc id="desc">Illustrated portrait of Alex Morgan, a fictional Chain Reaction conference speaker.</desc>

    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#39205f"/>
            <stop offset="55%" stop-color="#171324"/>
            <stop offset="100%" stop-color="#100d1b"/>
        </linearGradient>

        <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#49316c"/>
            <stop offset="100%" stop-color="#171323"/>
        </linearGradient>

        <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#f3c19f"/>
            <stop offset="100%" stop-color="#b97865"/>
        </linearGradient>

        <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#60402f"/>
            <stop offset="100%" stop-color="#211a20"/>
        </linearGradient>

        <radialGradient id="glow">
            <stop stop-color="#a855f7" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="600" height="750" fill="url(#background)"/>
    <ellipse cx="300" cy="300" rx="290" ry="320" fill="url(#glow)"/>

    <!-- Decorative blockchain elements -->
    <g fill="none" stroke="#a879ff" stroke-width="3" opacity=".55">
        <path d="M430 115 L490 80 L550 115 L550 185 L490 220 L430 185 Z"/>
        <path d="M430 115 L490 150 L550 115 M490 150 V220"/>
        <path d="M45 480 L95 450 L145 480 L145 540 L95 570 L45 540 Z" opacity=".4"/>
        <path d="M45 480 L95 510 L145 480 M95 510 V570" opacity=".4"/>
    </g>

    <path d="M0 625 L180 550" stroke="#f58b4b" stroke-width="5" opacity=".7"/>
    <path d="M420 750 L600 650" stroke="#f58b4b" stroke-width="4" opacity=".4"/>

    <!-- Shoulders and jacket -->
    <path d="M65 750 Q75 600 195 555 L405 555 Q525 600 535 750 Z"
          fill="url(#jacket)"/>

    <path d="M195 555 L260 750 H95 Q115 620 195 555Z"
          fill="#30203f"/>

    <path d="M405 555 L340 750 H505 Q485 620 405 555Z"
          fill="#241a35"/>

    <!-- Neck -->
    <path d="M245 465 L245 570 Q300 620 355 570 L355 465Z"
          fill="url(#skin)"/>

    <!-- Shirt -->
    <path d="M245 540 L300 610 L355 540 L385 750 H215Z"
          fill="#171321"/>

    <!-- Face -->
    <path d="M185 230 Q180 125 300 125 Q420 125 415 230
             L400 390 Q390 475 300 495 Q210 475 200 390Z"
          fill="url(#skin)"/>

    <!-- Ears -->
    <ellipse cx="190" cy="340" rx="23" ry="38" fill="#c88d75"/>
    <ellipse cx="410" cy="340" rx="23" ry="38" fill="#c88d75"/>

    <!-- Hair -->
    <path d="M183 275 Q140 200 190 130 Q205 55 285 65
             Q340 35 390 90 Q465 120 420 275
             Q405 215 375 190 Q335 210 300 170
             Q250 225 205 205Z"
          fill="url(#hair)"/>

    <path d="M190 180 Q220 95 290 105 Q335 65 380 125
             Q350 115 325 145 Q285 125 260 170
             Q225 205 190 180Z"
          fill="#79513b"/>

    <!-- Beard -->
    <path d="M198 365 Q205 455 300 485 Q395 455 402 365
             Q390 420 350 430 Q300 450 250 430 Q210 410 198 365Z"
          fill="#392721"/>

    <path d="M225 405 Q250 445 300 450 Q350 445 375 405
             Q350 480 300 480 Q250 480 225 405Z"
          fill="#493027"/>

    <!-- Eyes -->
    <g fill="#34241f">
        <ellipse cx="250" cy="310" rx="10" ry="7"/>
        <ellipse cx="350" cy="310" rx="10" ry="7"/>
    </g>

    <path d="M230 290 Q250 275 270 290 M330 290 Q350 275 370 290"
          fill="none" stroke="#55382c" stroke-width="7" stroke-linecap="round"/>

    <!-- Glasses -->
    <g fill="none" stroke="#171321" stroke-width="9">
        <rect x="210" y="280" width="83" height="65" rx="18"/>
        <rect x="307" y="280" width="83" height="65" rx="18"/>
        <path d="M293 300 Q300 292 307 300"/>
        <path d="M210 300 L190 290 M390 300 L410 290"/>
    </g>

    <!-- Nose and mouth -->
    <path d="M300 315 L288 375 Q300 387 312 375"
          fill="none" stroke="#a96f60" stroke-width="5" stroke-linecap="round"/>

    <path d="M270 415 Q300 432 330 415"
          fill="none" stroke="#75483e" stroke-width="5" stroke-linecap="round"/>

    <!-- Jacket details -->
    <path d="M195 555 L265 650 L230 750"
          fill="none" stroke="#725092" stroke-width="5"/>

    <path d="M405 555 L335 650 L370 750"
          fill="none" stroke="#725092" stroke-width="5"/>

    <!-- Purple conference lanyard -->
    <path d="M260 560 L300 680 L340 560"
          fill="none" stroke="#a879ff" stroke-width="9"/>

    <path d="M286 670 L314 670 L320 715 L280 715Z"
          fill="#f58b4b"/>

    <!-- Accent lighting -->
    <path d="M180 180 Q150 280 185 380"
          fill="none" stroke="#a879ff" stroke-width="8" opacity=".5"/>

    <path d="M420 180 Q450 280 415 380"
          fill="none" stroke="#f58b4b" stroke-width="5" opacity=".35"/>
</svg>