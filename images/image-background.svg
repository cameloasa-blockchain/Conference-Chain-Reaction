
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" fill="none">

    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#171321"/>
            <stop offset="100%" stop-color="#090711"/>
        </linearGradient>

        <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#B78AF5" stop-opacity=".7"/>
            <stop offset="100%" stop-color="#7138C8" stop-opacity=".12"/>
        </linearGradient>

        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#B78AF5" stop-opacity="0"/>
            <stop offset="50%" stop-color="#B78AF5" stop-opacity=".8"/>
            <stop offset="100%" stop-color="#F59A55" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="light">
            <stop offset="0%" stop-color="#8B4DE0" stop-opacity=".3"/>
            <stop offset="100%" stop-color="#8B4DE0" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="1600" height="700" fill="url(#background)"/>

    <!-- Ambient violet light -->
    <ellipse cx="1150" cy="350" rx="600" ry="450" fill="url(#light)"/>

    <!-- Network connections -->
    <g stroke="#9C65E8" stroke-opacity=".35" stroke-width="1.5">
        <path d="M850 120 L1100 250 L1370 100 L1570 260"/>
        <path d="M850 120 L900 430 L1150 550 L1370 100"/>
        <path d="M1100 250 L1320 430 L1570 260"/>
        <path d="M900 430 L700 600 L1150 550 L1500 620"/>
        <path d="M1320 430 L1500 620"/>
    </g>

    <!-- Network nodes -->
    <g fill="#B78AF5">
        <circle cx="850" cy="120" r="5"/>
        <circle cx="1100" cy="250" r="5"/>
        <circle cx="1370" cy="100" r="5"/>
        <circle cx="1570" cy="260" r="5"/>
        <circle cx="900" cy="430" r="5"/>
        <circle cx="1320" cy="430" r="5"/>
        <circle cx="1150" cy="550" r="5"/>
        <circle cx="700" cy="600" r="4"/>
    </g>

    <!-- Large central cube -->
    <g stroke="#B78AF5" stroke-width="3" stroke-linejoin="round">
        <path d="M1080 270 L1220 190 L1360 270 L1220 350 Z"
              fill="url(#cube)"/>
        <path d="M1080 270 L1080 430 L1220 510 L1220 350 Z"
              fill="#7138C8" fill-opacity=".2"/>
        <path d="M1220 350 L1360 270 L1360 430 L1220 510 Z"
              fill="#8B4DE0" fill-opacity=".25"/>
        <path d="M1220 190 L1220 350"/>
        <path d="M1080 270 L1220 350 L1360 270"/>
    </g>

    <!-- Smaller cube -->
    <g stroke="#9D68E8" stroke-width="2" stroke-linejoin="round" opacity=".8">
        <path d="M1450 430 L1520 390 L1590 430 L1520 470 Z"
              fill="url(#cube)"/>
        <path d="M1450 430 L1450 510 L1520 550 L1520 470 Z"
              fill="#7138C8" fill-opacity=".2"/>
        <path d="M1520 470 L1590 430 L1590 510 L1520 550 Z"
              fill="#8B4DE0" fill-opacity=".2"/>
    </g>

    <!-- Small decorative cube -->
    <g stroke="#F59A55" stroke-opacity=".65" stroke-width="2">
        <path d="M790 300 L850 265 L910 300 L850 335 Z"/>
        <path d="M790 300 L790 370 L850 405 L850 335 Z"/>
        <path d="M850 335 L910 300 L910 370 L850 405 Z"/>
    </g>

    <!-- Subtle glowing accent -->
    <path d="M0 640 Q400 570 800 650 T1600 610"
          stroke="url(#glow)"
          stroke-width="2"
          opacity=".7"/>

</svg>
